[package]
name = "pktcap"
version = "0.1.0"
edition = "2021"
description = "Cross-platform packet capture with pktbaffle filter expressions"
license = "MIT OR Apache-2.0"

[dependencies]
pktbaffle = { path = "..", features = ["vm"] }
pcap-file = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"
