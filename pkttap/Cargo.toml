[package]
name = "pkttap"
version = "0.3.0"
edition = "2021"
description = "Cross-platform packet capture with pktbaffle filter expressions"
license = "MIT"
keywords = ["pcap", "packet-capture", "network", "capture", "bpf"]
categories = ["network-programming"]
repository = "https://github.com/JamoBox/pktbaffle"
documentation = "https://docs.rs/pkttap"
readme = "README.md"

[dependencies]
pktbaffle = { version = "0.2.0", path = "../pktbaffle", features = ["vm"] }
pcap-file = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# `live/linux.rs` and `live/macos.rs` use `libc::ifreq`, which was added in
# libc 0.2.137 (PR rust-lang/libc#2960, 2022-10). 0.2.140 is a safe floor past
# that; the nightly `minimal-versions` job enforces this bound is honest.
libc = "0.2.140"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[dev-dependencies]
tempfile = "3"
pktbaffle = { version = "0.2.0", path = "../pktbaffle", features = ["vm"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "capture"
harness = false
