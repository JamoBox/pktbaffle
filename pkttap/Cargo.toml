[package]
name = "pkttap"
version = "0.1.0"
edition = "2021"
description = "Cross-platform packet capture with pktbaffle filter expressions"
license = "MIT"
keywords = ["pcap", "packet-capture", "network", "capture", "bpf"]
categories = ["network-programming"]
repository = "https://github.com/JamoBox/pktbaffle"
documentation = "https://docs.rs/pkttap"
readme = "README.md"

[dependencies]
pktbaffle = { version = "0.1.0", path = "../pktbaffle", features = ["vm"] }
pcap-file = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2.65"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[dev-dependencies]
tempfile = "3"
pktbaffle = { path = "../pktbaffle", features = ["vm"] }
