name: Benchmarks

on:
  schedule:
    - cron: '0 4 * * 1'  # Mondays at 04:00 UTC
  push:
    branches: [main]
    paths:
      - 'pktbaffle/benches/**'
      - 'pktbaffle/src/**'
      - 'pkttap/benches/**'
      - 'pkttap/src/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: bench
  cancel-in-progress: false  # never interrupt an in-flight bench run

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    # For label events only fire on the `performance` label; all other triggers
    # (schedule, push, workflow_dispatch) pass through unconditionally.
    if: |
      contains(fromJSON('["schedule", "push", "workflow_dispatch"]'), github.event_name) ||
      github.event.label.name == 'performance'
    permissions:
      contents: write        # push results to gh-pages
      pull-requests: write   # post regression comments on PRs

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench

      # Run all three benchmark targets in sequence, capturing combined output.
      # `tee -a` appends so a single file feeds the store step below.
      - name: Run compiler benchmarks
        run: cargo bench -p pktbaffle --bench compiler -- --output-format bencher 2>&1 | tee output.txt

      - name: Run VM benchmarks
        run: cargo bench -p pktbaffle --bench vm --features vm -- --output-format bencher 2>&1 | tee -a output.txt

      - name: Run capture benchmarks
        run: cargo bench -p pkttap --bench capture -- --output-format bencher 2>&1 | tee -a output.txt

      # github-action-benchmark fetches and checks out the gh-pages branch to
      # append historical data; it does NOT create that branch itself. On a
      # repo that has never published benchmark results the branch is absent,
      # so the fetch aborts with "couldn't find remote ref gh-pages" and the
      # whole job fails. Bootstrap an empty orphan branch on first run. Built in
      # a throwaway temp repo so the checked-out working tree (and rust-cache
      # state) is left untouched.
      - name: Ensure gh-pages branch exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch already exists"
          else
            echo "gh-pages branch missing; creating empty orphan branch"
            tmp="$(mktemp -d)"
            git init -q "$tmp"
            git -C "$tmp" checkout -q --orphan gh-pages
            git -C "$tmp" \
              -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -q --allow-empty -m "Initialize gh-pages branch for benchmark results"
            git -C "$tmp" push -q \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          fi

      # Parse Criterion stdout, append to the historical dataset in gh-pages,
      # and rebuild the chart page.  On PRs the action posts a regression comment
      # instead of pushing (auto-push only fires on the default branch).
      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name != 'pull_request' }}
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: false
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
